<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#232B5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Endereçar">
<link rel="manifest" href='data:application/manifest+json,{"name":"Endereçamento FanClub","short_name":"Endereçar","display":"standalone","background_color":"%23232B5F","theme_color":"%23232B5F","start_url":"."}'>
<title>Endereçamento · Teste</title>
<style>
  :root{--navy:#232B5F;--mag:#B81D55;--bg:#11142e;--card:#1b2044;--ok:#2ecc71}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#fff;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{background:var(--navy);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
  header b{font-size:15px;letter-spacing:.3px}
  header span{font-size:12px;color:#aab}
  #mode{font-size:12px;color:#f8b;font-weight:600}
  main{padding:12px;max-width:560px;margin:0 auto}
  .row{display:flex;gap:8px;margin-bottom:10px}
  .row>*{flex:1}
  input{background:var(--card);border:1px solid #2c3260;color:#fff;border-radius:10px;padding:12px;font-size:16px;width:100%}
  button{background:var(--card);border:1px solid #2c3260;color:#fff;border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer}
  button.pri{background:var(--mag);border-color:var(--mag)}
  button.go{background:var(--ok);border-color:var(--ok);color:#062}
  #camwrap{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4;margin-bottom:12px;cursor:pointer}
  video{width:100%;height:100%;object-fit:cover;display:block}
  #reticle{position:absolute;inset:22% 12%;border:3px solid var(--mag);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35);pointer-events:none}
  #tap{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
  #flash{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .14s}
  #big{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);padding:10px 14px;
       font:700 22px JetBrains Mono,monospace;letter-spacing:1px;text-align:center;pointer-events:none}
  #big small{display:block;font:500 11px Inter;color:#9cf;letter-spacing:0}
  .stats{display:flex;gap:8px;margin-bottom:10px}
  .stat{flex:1;background:var(--card);border-radius:10px;padding:10px;text-align:center}
  .stat b{display:block;font-size:24px}.stat span{font-size:11px;color:#aab}
  ul{list-style:none;margin:0;padding:0;max-height:210px;overflow:auto}
  li{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #2c3260;font-size:13px}
  li b{font-family:JetBrains Mono,monospace}
  li em{color:#9cf;font-style:normal;font-size:11px}
  .hint{font-size:12px;color:#889;text-align:center;margin:8px 0}
</style>
</head>
<body>
<header><b>Endereçamento · <span>centro + toque</span></b><span id="mode">produto</span></header>
<main>
  <div class="row">
    <input id="end" placeholder="Endereço atual" autocomplete="off" style="flex:1">
    <button id="bipEnd" style="flex:0 0 auto">Bipar end.</button>
  </div>

  <div id="camwrap">
    <video id="v" playsinline muted></video>
    <div id="reticle"></div><div id="flash"></div>
    <div id="tap">toque na imagem pra ler o código no quadro</div>
    <div id="big">—<small>inicie a câmera e toque pra ler</small></div>
  </div>

  <div class="row">
    <button id="start" class="pri">▶ Iniciar câmera</button>
    <button id="torch" style="flex:0 0 auto;display:none">🔦</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="cnt">0</b><span>leituras</span></div>
    <div class="stat"><b id="fail">0</b><span>não leu</span></div>
  </div>

  <div class="row">
    <button id="csv" class="go">⬇ CSV</button>
    <button id="clr">Limpar</button>
  </div>
  <div class="hint" id="status">Toque em Iniciar e permita a câmera. Precisa estar hospedado em HTTPS.</div>

  <ul id="list"></ul>
</main>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let stream,track,reader,rows=[],ok=0,fail=0,capturing='produto',ac;

const hints=new Map();
hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13]);
hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
reader=new ZXing.BrowserMultiFormatReader(hints);

function initAudio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
function beep(f,d,v){try{if(!ac)return;if(ac.state==='suspended')ac.resume();
  const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;
  o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(v,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function vib(p){navigator.vibrate&&navigator.vibrate(p);}
function flash(c){const f=$('#flash');f.style.background=c;f.style.opacity=.55;setTimeout(()=>f.style.opacity=0,150);}

async function startCam(){
  initAudio();
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;track=null;$('#start').textContent='▶ Iniciar câmera';$('#status').textContent='Parado.';return;}
  $('#status').textContent='Iniciando câmera…';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
    $('#v').srcObject=stream;await $('#v').play();
    track=stream.getVideoTracks()[0];
    const caps=track.getCapabilities?track.getCapabilities():{};
    if(caps.torch)$('#torch').style.display='';
    $('#start').textContent='⏸ Parar câmera';
    $('#status').textContent='Mire o código no quadro e TOQUE na imagem pra ler.';
  }catch(e){$('#status').textContent='Erro na câmera: '+e.message+' (precisa HTTPS + permissão).';}
}

function decodeCanvas(c){
  if(typeof reader.decodeFromCanvas==='function')return reader.decodeFromCanvas(c);
  const src=new ZXing.HTMLCanvasElementLuminanceSource(c);
  const mfr=new ZXing.MultiFormatReader();mfr.setHints(hints);
  return mfr.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src)));
}

function scan(){
  if(!stream){$('#status').textContent='Inicie a câmera primeiro.';return;}
  initAudio();
  const v=$('#v'),VW=v.videoWidth,VH=v.videoHeight;
  if(!VW)return;
  // recorte que casa exatamente com o quadro visível (object-fit:cover)
  const r=v.getBoundingClientRect(),CW=r.width,CH=r.height;
  const scale=Math.max(CW/VW,CH/VH),offX=(VW*scale-CW)/2,offY=(VH*scale-CH)/2;
  const sx=(0.12*CW+offX)/scale,sy=(0.22*CH+offY)/scale,sw=(0.76*CW)/scale,sh=(0.56*CH)/scale;
  const cv=document.createElement('canvas');cv.width=Math.round(sw);cv.height=Math.round(sh);
  cv.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
  let code=null;try{const res=decodeCanvas(cv);code=res&&(res.getText?res.getText():res.text);}catch(e){}
  if(!code){fail++;$('#fail').textContent=fail;flash('#e74c3c');beep(200,.2,.55);vib([40,40,40]);
    $('#big').innerHTML='não leu<small>centralize melhor e toque de novo</small>';return;}
  if(capturing==='endereco'){$('#end').value=code;capturing='produto';$('#mode').textContent='produto';
    flash('#2ecc71');beep(1200,.12,.5);vib(40);$('#big').innerHTML=code+'<small>endereço definido</small>';return;}
  ok++;rows.push({end:$('#end').value.trim(),ean:code,ts:new Date().toISOString()});
  $('#cnt').textContent=ok;
  $('#big').innerHTML=code+'<small>'+ok+' lidas · '+($('#end').value.trim()||'sem endereço')+'</small>';
  const li=document.createElement('li');li.innerHTML='<b>'+code+'</b><em>'+($('#end').value.trim()||'—')+'</em>';
  $('#list').prepend(li);while($('#list').children.length>12)$('#list').lastChild.remove();
  flash('#2ecc71');beep(880,.14,.55);vib(60);
}

$('#camwrap').onclick=scan;
$('#start').onclick=(e)=>{e.stopPropagation();startCam();};
$('#torch').onclick=(e)=>{e.stopPropagation();if(!track)return;const on=$('#torch').dataset.on!=='1';
  track.applyConstraints({advanced:[{torch:on}]});$('#torch').dataset.on=on?'1':'0';$('#torch').style.opacity=on?1:.5;};
$('#bipEnd').onclick=(e)=>{e.stopPropagation();capturing='endereco';$('#mode').textContent='← toque pra bipar ENDEREÇO';};
$('#clr').onclick=(e)=>{e.stopPropagation();if(!confirm('Limpar tudo?'))return;rows=[];ok=0;fail=0;
  $('#list').innerHTML='';$('#cnt').textContent=0;$('#fail').textContent=0;$('#big').innerHTML='—<small>toque na imagem pra ler</small>';};
$('#csv').onclick=(e)=>{e.stopPropagation();if(!rows.length)return alert('Nada pra exportar.');
  const csv='endereco;ean;datahora\n'+rows.map(r=>r.end+';'+r.ean+';'+r.ts).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='enderecamento_'+Date.now()+'.csv';a.click();};
</script>
</body>
</html>
