<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#232B5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Endereçar">
<link rel="manifest" href='data:application/manifest+json,{"name":"Endereçamento FanClub","short_name":"Endereçar","display":"standalone","background_color":"%23232B5F","theme_color":"%23232B5F","start_url":"."}'>
<title>Endereçamento</title>
<style>
  :root{--navy:#232B5F;--mag:#B81D55;--bg:#11142e;--card:#1b2044;--ok:#2ecc71;--warn:#f1c40f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#fff;display:flex;flex-direction:column;overflow:hidden;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{background:var(--navy);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;flex:0 0 auto}
  header b{font-size:15px}
  .dot{width:9px;height:9px;border-radius:50%;background:#e74c3c;display:inline-block;margin-right:5px;vertical-align:middle}
  .dot.on{background:var(--ok)}
  #who{font-size:12px;color:#9cf}
  main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto}
  #scan{flex:0 0 auto;padding:10px 12px 0}
  #panel{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 12px 16px}
  .row{display:flex;gap:8px;margin-bottom:10px}
  input{background:var(--card);border:1px solid #2c3260;color:#fff;border-radius:10px;padding:12px;font-size:16px;width:100%}
  button{background:var(--card);border:1px solid #2c3260;color:#fff;border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer}
  button.pri{background:var(--mag);border-color:var(--mag)}
  button.go{background:var(--ok);border-color:var(--ok);color:#062}
  button.dgr{background:#3a1420;border-color:#7a1e38;color:#f7a}
  .addrbar{background:var(--card);border:1px solid #2c3260;border-radius:12px;padding:12px;margin-bottom:10px}
  .addrbar .lbl{font-size:11px;color:#9ab}
  .addrbar .val{font:700 20px JetBrains Mono,monospace;letter-spacing:1px}
  .addrbar.none{border-color:var(--warn);background:#2a2612}
  #summary{background:var(--card);border:1px solid #2c3260;border-radius:12px;padding:12px;margin-bottom:10px;font-size:13px;display:none}
  #summary .big{font-size:26px;font-weight:800}
  #summary .sub{color:#9cf;font-size:12px;margin-bottom:8px}
  #summary table{width:100%;border-collapse:collapse;font-size:12px}
  #summary td{padding:3px 0;border-bottom:1px solid #2c3260}
  #summary td:last-child{text-align:right;font-family:JetBrains Mono,monospace}
  #camwrap{position:relative;background:#000;border-radius:14px;overflow:hidden;height:44vh;cursor:pointer}
  video{width:100%;height:100%;object-fit:cover;display:block}
  #reticle{position:absolute;inset:22% 12%;border:3px solid var(--mag);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35);pointer-events:none}
  #tap{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:12px;text-shadow:0 1px 3px #000;pointer-events:none}
  #flash{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .14s}
  #big{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);padding:10px 14px;
       font:700 20px JetBrains Mono,monospace;text-align:center;pointer-events:none}
  #big small{display:block;font:500 11px Inter;color:#9cf}
  ul{list-style:none;margin:0;padding:0;max-height:200px;overflow:auto}
  li{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #2c3260;font-size:13px}
  li b{font-family:JetBrains Mono,monospace}
  li .x{color:#f7a;padding:2px 10px;font-weight:700}
  .hint{font-size:12px;color:#889;text-align:center;margin:8px 0;word-break:break-word}
  #setup{position:fixed;inset:0;background:var(--bg);z-index:9;padding:20px;overflow:auto}
  #setup h2{color:var(--mag)}
  #setup label{display:block;font-size:12px;color:#9ab;margin:12px 0 4px}
  .mini{font-size:11px;color:#889;text-align:center;margin-top:8px}
</style>
</head>
<body>

<div id="setup">
  <h2>Configurar</h2>
  <p class="hint" style="text-align:left">Preencha uma vez neste aparelho. A URL e a chave são as mesmas do projeto pra todo mundo; o nome é seu.</p>
  <label>Supabase URL</label><input id="c_url" placeholder="https://xxxxx.supabase.co" autocomplete="off">
  <label>Chave anon (public)</label><input id="c_key" placeholder="eyJhbGciOi..." autocomplete="off">
  <label>Seu nome (operador)</label><input id="c_name" placeholder="ex: Igor" autocomplete="off">
  <div class="row" style="margin-top:16px"><button id="c_save" class="pri">Salvar e testar conexão</button></div>
  <p class="mini" id="c_status"></p>
</div>

<header>
  <b><span class="dot" id="dot"></span>Endereçamento</b>
  <span id="who" onclick="openSetup()">⚙︎ —</span>
</header>

<main>
  <div id="scan">
    <div class="addrbar none" id="addrbar">
      <div class="lbl">Endereço atual</div>
      <div class="val" id="addrval">— defina primeiro —</div>
      <div class="row" style="margin:8px 0 0">
        <input id="end" placeholder="Digite ou bipe o endereço" autocomplete="off" style="flex:1">
        <button id="setAddr" class="pri" style="flex:0 0 auto">Definir</button>
        <button id="chgAddr" style="flex:0 0 auto;display:none">Trocar</button>
      </div>
    </div>

    <div id="camwrap">
      <video id="v" playsinline muted></video>
      <div id="reticle"></div><div id="flash"></div>
      <div id="tap">toque na imagem pra ler</div>
      <div id="big">—<small>inicie a câmera</small></div>
    </div>

    <div class="row" style="margin:8px 0 0">
      <button id="start" class="pri">▶ Iniciar câmera</button>
      <button id="torch" style="flex:0 0 auto;display:none">🔦</button>
    </div>
  </div>

  <div id="panel">
    <div id="summary"></div>
    <div class="hint" id="status">Configure a conexão e inicie a câmera. Precisa de HTTPS.</div>
    <div class="row">
      <button id="csv" class="go">⬇ CSV endereço</button>
      <button id="delMine" class="dgr">Excluir minha contagem</button>
    </div>
    <ul id="list"></ul>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let URL_="",KEY="",ME="",stream,track,reader,addr="",addrRows=[],session=[],ac,pollTimer;

const F=ZXing.BarcodeFormat,DH=ZXing.DecodeHintType;
function mkHints(fmts){const h=new Map();h.set(DH.POSSIBLE_FORMATS,fmts);h.set(DH.TRY_HARDER,true);return h;}
const hintsProd=mkHints([F.EAN_13]);                                  // produto: só EAN-13
const hintsAddr=mkHints([F.CODE_128,F.CODE_39,F.QR_CODE,F.EAN_13]);   // endereço: amplo

/* ---------- config ---------- */
function loadCfg(){URL_=(localStorage.sb_url||'').replace(/\/+$/,'');KEY=localStorage.sb_key||'';ME=localStorage.op_name||'';}
function openSetup(){$('#c_url').value=URL_;$('#c_key').value=KEY;$('#c_name').value=ME;$('#setup').style.display='block';}
function closeSetup(){$('#setup').style.display='none';}
$('#c_save').onclick=async()=>{
  const u=$('#c_url').value.trim().replace(/\/+$/,''),k=$('#c_key').value.trim(),n=$('#c_name').value.trim();
  if(!u||!k||!n){$('#c_status').textContent='Preencha os três campos.';return;}
  $('#c_status').textContent='Testando…';
  try{
    const r=await fetch(u+'/rest/v1/bipagens?select=id&limit=1',{headers:{apikey:k,Authorization:'Bearer '+k}});
    if(!r.ok){const t=await r.text();$('#c_status').textContent='Falhou ('+r.status+'): '+t.slice(0,140);return;}
    localStorage.sb_url=u;localStorage.sb_key=k;localStorage.op_name=n;loadCfg();
    setDot(true);$('#who').textContent='⚙︎ '+ME;closeSetup();$('#status').textContent='Conectado. Defina um endereço pra começar.';
  }catch(e){$('#c_status').textContent='Erro de rede: '+e.message;}
};
function setDot(on){$('#dot').className='dot'+(on?' on':'');}

/* ---------- supabase rest ---------- */
function H(extra){return Object.assign({apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},extra||{});}
async function apiInsert(o){const r=await fetch(URL_+'/rest/v1/bipagens',{method:'POST',headers:H({Prefer:'return=representation'}),body:JSON.stringify(o)});if(!r.ok)throw new Error((await r.text()).slice(0,160));return (await r.json())[0];}
async function apiAddr(a){const r=await fetch(URL_+'/rest/v1/bipagens?endereco=eq.'+encodeURIComponent(a)+'&select=id,ean,usuario&order=id.desc',{headers:H()});if(!r.ok)throw new Error((await r.text()).slice(0,160));return r.json();}
async function apiDelId(id){const r=await fetch(URL_+'/rest/v1/bipagens?id=eq.'+id,{method:'DELETE',headers:H()});if(!r.ok)throw new Error((await r.text()).slice(0,160));}
async function apiDelMine(a){const r=await fetch(URL_+'/rest/v1/bipagens?endereco=eq.'+encodeURIComponent(a)+'&usuario=eq.'+encodeURIComponent(ME),{method:'DELETE',headers:H()});if(!r.ok)throw new Error((await r.text()).slice(0,160));}

/* ---------- audio/feedback ---------- */
function initAudio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
function tone(f,d,v){try{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function beep(f,d,v){if(!ac)return;if(ac.state==='suspended'){ac.resume().then(()=>tone(f,d,v)).catch(()=>{});}else{tone(f,d,v);}}
function vib(p){navigator.vibrate&&navigator.vibrate(p);}
function flash(c){const f=$('#flash');f.style.background=c;f.style.opacity=.55;setTimeout(()=>f.style.opacity=0,150);}
function okFx(){flash('#2ecc71');beep(880,.14,.55);vib(60);}
function errFx(){flash('#e74c3c');beep(200,.2,.55);vib([40,40,40]);}

/* ---------- endereço ---------- */
function applyAddr(a){
  addr=a.trim();
  if(!addr){ // sem endereço
    $('#addrbar').className='addrbar none';$('#addrval').textContent='— defina primeiro —';
    $('#end').style.display='';$('#setAddr').style.display='';$('#chgAddr').style.display='none';
    $('#summary').style.display='none';stopPoll();addrRows=[];session=[];renderList();
    return;
  }
  $('#addrbar').className='addrbar';$('#addrval').textContent=addr;
  $('#end').style.display='none';$('#setAddr').style.display='none';$('#chgAddr').style.display='';
  session=[];renderList();refreshSummary();startPoll();
}
$('#setAddr').onclick=()=>{const v=$('#end').value.trim();if(v)applyAddr(v);};
$('#chgAddr').onclick=()=>{$('#end').value='';applyAddr('');};

/* ---------- resumo ---------- */
async function refreshSummary(){
  if(!addr)return;
  try{
    addrRows=await apiAddr(addr);setDot(true);
    const total=addrRows.length,mine=addrRows.filter(r=>r.usuario===ME).length;
    const byEan={};addrRows.forEach(r=>byEan[r.ean]=(byEan[r.ean]||0)+1);
    const byUser={};addrRows.forEach(r=>byUser[r.usuario]=(byUser[r.usuario]||0)+1);
    let html='<div class="big">'+total+' <span style="font-size:13px;font-weight:500;color:#9ab">unidades no endereço</span></div>';
    html+='<div class="sub">suas: '+mine+' · outros: '+(total-mine)+' · '+Object.keys(byEan).length+' SKUs</div>';
    html+='<table>';
    Object.keys(byUser).forEach(u=>{html+='<tr><td>'+(u===ME?'você':u)+'</td><td>'+byUser[u]+'</td></tr>';});
    html+='</table>';
    if(Object.keys(byEan).length){html+='<div class="sub" style="margin-top:8px">Por EAN</div><table>';
      Object.keys(byEan).sort().forEach(e=>{html+='<tr><td>'+e+'</td><td>'+byEan[e]+'</td></tr>';});html+='</table>';}
    $('#summary').innerHTML=html;$('#summary').style.display='block';
  }catch(e){setDot(false);$('#status').textContent='Erro ao ler resumo: '+e.message;}
}
function startPoll(){stopPoll();pollTimer=setInterval(refreshSummary,7000);}
function stopPoll(){if(pollTimer)clearInterval(pollTimer);pollTimer=null;}

/* ---------- lista sessão ---------- */
function renderList(){
  const ul=$('#list');ul.innerHTML='';
  session.slice(0,15).forEach(s=>{
    const li=document.createElement('li');
    li.innerHTML='<span><b>'+s.ean+'</b> <em style="color:#9cf;font-size:11px">'+s.endereco+'</em></span>';
    const x=document.createElement('span');x.className='x';x.textContent='✕';
    x.onclick=async()=>{try{await apiDelId(s.id);session=session.filter(i=>i.id!==s.id);renderList();refreshSummary();}catch(e){alert('Erro ao excluir: '+e.message);}};
    li.appendChild(x);ul.appendChild(li);
  });
}

/* ---------- câmera ---------- */
async function startCam(){
  initAudio();
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;track=null;$('#start').textContent='▶ Iniciar câmera';$('#status').textContent='Parado.';return;}
  $('#status').textContent='Iniciando câmera…';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
    $('#v').srcObject=stream;await $('#v').play();
    track=stream.getVideoTracks()[0];const caps=track.getCapabilities?track.getCapabilities():{};if(caps.torch)$('#torch').style.display='';
    $('#start').textContent='⏸ Parar câmera';$('#status').textContent=addr?'Toque na imagem pra bipar o produto.':'Defina o endereço, depois bipe os produtos.';
  }catch(e){$('#status').textContent='Erro na câmera: '+e.message;}
}
function readCrop(h){
  const v=$('#v'),VW=v.videoWidth,VH=v.videoHeight;if(!VW)return null;
  const r=v.getBoundingClientRect(),CW=r.width,CH=r.height;
  const sc=Math.max(CW/VW,CH/VH),ox=(VW*sc-CW)/2,oy=(VH*sc-CH)/2;
  const sx=(0.12*CW+ox)/sc,sy=(0.22*CH+oy)/sc,sw=(0.76*CW)/sc,sh=(0.56*CH)/sc;
  const cv=document.createElement('canvas');cv.width=Math.round(sw);cv.height=Math.round(sh);
  cv.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
  try{
    const src=new ZXing.HTMLCanvasElementLuminanceSource(cv);
    const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
    const mfr=new ZXing.MultiFormatReader();mfr.setHints(h);
    const res=mfr.decode(bmp);
    return res?(res.getText?res.getText():res.text):null;
  }catch(e){return null;}
}
async function scan(){
  if(!stream){$('#status').textContent='Inicie a câmera primeiro.';return;}
  if(!URL_||!KEY||!ME){openSetup();return;}
  initAudio();
  const code=readCrop(addr?hintsProd:hintsAddr);
  if(!code){errFx();$('#big').innerHTML='não leu<small>centralize e toque de novo</small>';return;}
  if(!addr){ // força endereço: primeira leitura define endereço
    $('#end').value=code;applyAddr(code);beep(1200,.12,.5);flash('#2ecc71');vib(40);
    $('#big').innerHTML=code+'<small>endereço definido — agora bipe os produtos</small>';return;
  }
  // insere produto
  try{
    const rowu=await apiInsert({endereco:addr,ean:code,usuario:ME});
    session.unshift({id:rowu.id,ean:code,endereco:addr});renderList();
    $('#big').innerHTML=code+'<small>gravado em '+addr+'</small>';okFx();refreshSummary();
  }catch(e){
    errFx();setDot(false);$('#big').innerHTML='NÃO gravou<small>'+e.message+'</small>';$('#status').textContent='Falha ao gravar: '+e.message;
  }
}

/* ---------- ações ---------- */
$('#camwrap').onclick=scan;
$('#start').onclick=e=>{e.stopPropagation();startCam();};
$('#torch').onclick=e=>{e.stopPropagation();if(!track)return;const on=$('#torch').dataset.on!=='1';track.applyConstraints({advanced:[{torch:on}]});$('#torch').dataset.on=on?'1':'0';$('#torch').style.opacity=on?1:.5;};
$('#delMine').onclick=async()=>{
  if(!addr)return alert('Nenhum endereço definido.');
  if(!confirm('Excluir TODA a sua contagem em '+addr+'?'))return;
  try{await apiDelMine(addr);session=[];renderList();refreshSummary();$('#status').textContent='Sua contagem em '+addr+' foi excluída.';}
  catch(e){alert('Erro: '+e.message);}
};
$('#csv').onclick=async()=>{
  if(!addr)return alert('Defina um endereço.');
  await refreshSummary();
  if(!addrRows.length)return alert('Sem contagem neste endereço.');
  const csv='endereco;ean;usuario\n'+addrRows.map(r=>addr+';'+r.ean+';'+r.usuario).join('\n');
  const a=document.createElement('a');a.href=window.URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='endereco_'+addr+'_'+Date.now()+'.csv';a.click();
};

/* ---------- init ---------- */
loadCfg();
if(URL_&&KEY&&ME){$('#who').textContent='⚙︎ '+ME;setDot(true);closeSetup();$('#status').textContent='Conectado. Defina um endereço pra começar.';}
else{openSetup();}
</script>
</body>
</html>
